name: Blockwatch linter

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  blockwatch:
    name: Blockwatch
    runs-on: ubuntu-latest
    steps:
      # The action checks out the repository itself and diffs against the PR base or the previous push.
      - uses: mennanov/blockwatch-action@v1
