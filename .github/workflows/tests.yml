name: Go tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  go-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # <block name="go-version" same-as-pattern="\d+\.\d+">
        # Must include the go directive's major.minor from go.mod (checked by go.mod:go-version).
        go-version: [ '1.25', '1.26' ]
        # </block>

    services:
      # Every image here must also be in docker-compose.yml (which additionally runs dynamodb-local).
      # <block name="testing-services" same-as="docker-compose.yml:testing-services" same-as-mode="subset" same-as-pattern="image: \S+">
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.5
        env:
            ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
            ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
        ports:
          - 2379:2379
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        env:
          IP: 0.0.0.0
          INITIAL_PORT: 11000
        ports:
          - 11000-11005:11000-11005
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      consul:
        image: hashicorp/consul:1.21
        ports:
          - 8500:8500
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181
      postgresql:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      cosmos:
        # Pinned by digest (vnext-EN20260403, multi-arch amd64+arm64). The rolling
        # `vnext-preview` tag — and even the dated `vnext-EN*` tags — now serve a
        # build that stops honoring short document TTLs, breaking the *TTLExpiration
        # tests with 409 Conflict. Re-pin to a newer digest once that is fixed upstream.
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:bf3bd3cbe3fae2005a0745f77b01d1fc8cd04112193f3ee32289ee15ee9ae5fa
        env:
          PROTOCOL: http
          COSMOS_HTTP_CONNECTION_WITHOUT_TLS_ALLOWED: "true"
        ports:
          - "8081:8081"
      # </block>

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Setup DynamoDB Local
        uses: rrainn/dynamodb-action@v4.0.0
        with:
          port: 8000
      - name: Run tests
        # The same variables as SERVICES in the Makefile; their values may differ.
        # <block name="test-env-vars" same-as="Makefile:test-env-vars" same-as-pattern="(?P<value>[A-Z_]+):">
        env:
          ETCD_ENDPOINTS: 'localhost:2379'
          REDIS_ADDR: 'localhost:6379'
          REDIS_NODES: 'localhost:11000,localhost:11001,localhost:11002,localhost:11003,localhost:11004,localhost:11005'
          CONSUL_ADDR: 'localhost:8500'
          ZOOKEEPER_ENDPOINTS: 'localhost:2181'
          AWS_ADDR: 'localhost:8000'
          MEMCACHED_ADDR: '127.0.0.1:11211'
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/?sslmode=disable
          COSMOS_ADDR: '127.0.0.1:8081'
        # </block>
        # Coverage is collected on the oldest supported Go, the go directive in go.mod.
        # <block name="coverage-go-version" same-as="go.mod:go-version" same-as-pattern="\d+\.\d+">
        run: |
          if [ "${{ matrix.go-version }}" = "1.25" ]; then
            go test -race -coverprofile=coverage.txt -covermode=atomic ./...
          else
            go test -race ./...
          fi
      - uses: codecov/codecov-action@v5
        if: matrix.go-version == '1.25'
        # </block>
        with:
          verbose: true

