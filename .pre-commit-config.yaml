repos:
  # Installs a prebuilt blockwatch from PyPI; no local install needed.
  - repo: https://github.com/mennanov/blockwatch
    rev: v0.15.0
    hooks:
      - id: blockwatch
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
